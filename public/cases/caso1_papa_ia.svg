<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="coat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo / Cenário Urbano Desfocado -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="180" fill="#334155" opacity="0.4" filter="blur(40px)"/>
  <circle cx="650" cy="250" r="220" fill="#1e293b" opacity="0.6" filter="blur(50px)"/>

  <!-- Calçada / Chão -->
  <rect y="480" width="800" height="120" fill="#1e293b"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#334155" stroke-width="2"/>

  <!-- Silhueta da Jaqueta Puffer Branca Oversized -->
  <!-- Corpo da Jaqueta (Gomos Puffer) -->
  <path d="M 280 230 C 260 210, 310 190, 400 190 C 490 190, 540 210, 520 230 C 590 280, 610 390, 580 470 C 540 500, 260 500, 220 470 C 190 390, 210 280, 280 230 Z" fill="url(#coat)" filter="url(#shadow)"/>

  <!-- Linhas e Gomos acolchoados da Jaqueta -->
  <path d="M 250 290 Q 400 320 550 290" stroke="#94a3b8" stroke-width="6" fill="none" opacity="0.6"/>
  <path d="M 230 350 Q 400 390 570 350" stroke="#94a3b8" stroke-width="7" fill="none" opacity="0.6"/>
  <path d="M 225 410 Q 400 450 575 410" stroke="#94a3b8" stroke-width="7" fill="none" opacity="0.6"/>
  <path d="M 235 460 Q 400 490 565 460" stroke="#94a3b8" stroke-width="5" fill="none" opacity="0.5"/>

  <!-- Zíper Central -->
  <line x1="400" y1="210" x2="400" y2="485" stroke="#64748b" stroke-width="5" stroke-dasharray="8,3"/>

  <!-- Crucifixo Prata (Detalhe gerado por IA com encaixe solto) -->
  <rect x="396" y="310" width="8" height="48" fill="#e2e8f0" rx="3" filter="url(#shadow)"/>
  <rect x="382" y="322" width="36" height="8" fill="#e2e8f0" rx="3" filter="url(#shadow)"/>
  <circle cx="400" cy="305" r="5" fill="#cbd5e1"/>

  <!-- Cordão do Crucifixo -->
  <path d="M 370 230 Q 400 305 400 305 Q 400 305 430 230" stroke="#cbd5e1" stroke-width="3" fill="none"/>

  <!-- Gola Alta Acolchoada Puffer -->
  <ellipse cx="400" cy="225" rx="80" ry="25" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Cabeça / Rosto do Pontífice -->
  <!-- Pescoço -->
  <rect x="375" y="180" width="50" height="35" fill="#fed7aa"/>
  <!-- Rosto -->
  <ellipse cx="400" cy="165" rx="42" ry="50" fill="#ffedd5"/>
  <!-- Solidéu Branco (Zucchetto) -->
  <path d="M 363 138 C 363 110, 437 110, 437 138 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Cabelo Branco Lateral -->
  <path d="M 360 145 Q 355 165 365 175" stroke="#f1f5f9" stroke-width="6" fill="none"/>
  <path d="M 440 145 Q 445 165 435 175" stroke="#f1f5f9" stroke-width="6" fill="none"/>

  <!-- Óculos com Armação Metálica -->
  <rect x="372" y="152" width="22" height="15" rx="4" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <rect x="406" y="152" width="22" height="15" rx="4" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <line x1="394" y1="158" x2="406" y2="158" stroke="#64748b" stroke-width="2"/>

  <!-- Olhos e Expressão Serena -->
  <ellipse cx="383" cy="159" rx="3" ry="2" fill="#334155"/>
  <ellipse cx="417" cy="159" rx="3" ry="2" fill="#334155"/>
  <path d="M 400 162 L 397 175 L 403 175" stroke="#d97706" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 388 188 Q 400 193 412 188" stroke="#b45309" stroke-width="2.5" fill="none"/>

  <!-- Mão com luva/textura típica de IA -->
  <ellipse cx="260" cy="460" rx="25" ry="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <ellipse cx="540" cy="460" rx="25" ry="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Tarja de Simulação de Rede Social -->
  <rect x="30" y="30" width="280" height="42" rx="10" fill="#000000" opacity="0.75"/>
  <circle cx="55" cy="51" r="12" fill="#3b82f6"/>
  <text x="75" y="47" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Viral no Reddit / Midjourney</text>
  <text x="75" y="62" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Simulação Educativa de IA</text>

  <!-- Selo "Gerado por IA" para didática -->
  <rect x="610" y="30" width="160" height="34" rx="8" fill="#ef4444" opacity="0.9"/>
  <text x="690" y="52" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Artefato de IA (2023)</text>
</svg>
