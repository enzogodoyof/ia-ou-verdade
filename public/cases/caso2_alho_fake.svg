<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="yellowText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadowRed">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo Alerta Vermelho -->
  <rect width="800" height="600" fill="url(#bgRed)"/>

  <!-- Faixas Diagonais de Alerta (Estilo Perigo/Sensacionalista) -->
  <rect x="-100" y="20" width="1000" height="30" fill="#facc15" transform="rotate(-3, 400, 300)" opacity="0.25"/>
  <rect x="-100" y="540" width="1000" height="30" fill="#facc15" transform="rotate(-3, 400, 300)" opacity="0.25"/>

  <!-- Tarja Superior "URGENTE / COMPARTILHEM" -->
  <rect x="40" y="35" width="720" height="60" rx="12" fill="#dc2626" stroke="#facc15" stroke-width="3" filter="url(#shadowRed)"/>
  <text x="400" y="74" font-family="Arial Black, Impact, sans-serif" font-size="28" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="2">
    ⚠️ ALERTA MÁXIMO: A MÍDIA NÃO QUER QUE VOCÊ SAIBA! ⚠️
  </text>

  <!-- Ilustração Central: Cabeça de Alho + Eletrocardiograma -->
  <g transform="translate(400, 260)" filter="url(#shadowRed)">
    <!-- Aura de cura milagrosa falsa -->
    <circle cx="0" cy="0" r="140" fill="#fef08a" opacity="0.15"/>
    
    <!-- Prato / Base -->
    <ellipse cx="0" cy="65" rx="160" ry="40" fill="#1c1917" opacity="0.5"/>

    <!-- Bulbo de Alho Central -->
    <path d="M 0 -80 C -60 -40, -90 10, -60 60 C -30 80, 30 80, 60 60 C 90 10, 60 -40, 0 -80 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4"/>
    
    <!-- Gomos do Alho -->
    <path d="M 0 -80 Q -30 0 0 75" stroke="#cbd5e1" stroke-width="4" fill="none"/>
    <path d="M 0 -80 Q 30 0 0 75" stroke="#cbd5e1" stroke-width="4" fill="none"/>
    <path d="M -30 -30 Q -60 15 -35 65" stroke="#cbd5e1" stroke-width="3" fill="none"/>
    <path d="M 30 -30 Q 60 15 35 65" stroke="#cbd5e1" stroke-width="3" fill="none"/>

    <!-- Caule superior -->
    <rect x="-6" y="-105" width="12" height="30" rx="3" fill="#d97706"/>

    <!-- Linha de Batimento Cardíaco Eletrocardiograma -->
    <path d="M -280 40 L -140 40 L -110 0 L -80 80 L -50 -40 L -20 40 L 140 40 L 170 -20 L 200 60 L 230 40 L 280 40" stroke="#22c55e" stroke-width="6" fill="none" opacity="0.85"/>
  </g>

  <!-- Tarja de Texto Falso Milagroso -->
  <rect x="40" y="380" width="720" height="175" rx="16" fill="#18181b" stroke="#ef4444" stroke-width="2" filter="url(#shadowRed)"/>
  
  <text x="400" y="420" font-family="Arial Black, Impact, sans-serif" font-size="24" font-weight="900" fill="#facc15" text-anchor="middle">
    CURA DO INFARTO DESCOBERTA EM ZURIQUE?
  </text>
  
  <text x="400" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    "Apenas 3 dentes em jejum desentopem 99% das veias em 48h!"
  </text>

  <text x="400" y="490" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">
    Suposto estudo do Dr. Hans Müller • Repasse antes que apaguem!
  </text>

  <!-- Tag de simulação de fake news -->
  <rect x="290" y="512" width="220" height="28" rx="14" fill="#ef4444"/>
  <text x="400" y="531" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
    SIMULAÇÃO DE CORRENTE FALSA
  </text>
</svg>
